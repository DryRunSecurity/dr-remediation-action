name: DryRun comment remediation

on:
  workflow_call:
    inputs:
      pr_number:
        description: Same-repository PR number for manual remediation
        type: string
        default: ''
      comment_id:
        description: DryRun timeline comment ID; blank selects the most recently updated verified comment
        type: string
        default: ''
      provider:
        description: Model API provider (openai or anthropic)
        type: string
        default: openai
      model:
        description: Model name; blank uses gpt-5.5 or claude-sonnet-4-5 according to provider
        type: string
        default: ''
      base_url:
        description: HTTPS compatible API endpoint; blank uses the provider SDK default
        type: string
        default: ''
      use_responses_api:
        description: Use the Responses API for OpenAI; ignored for Anthropic
        type: boolean
        default: true
    secrets:
      MODEL_API_KEY:
        description: API key for the explicitly selected provider and endpoint
        required: true
      MODEL_BASE_URL:
        description: Private HTTPS model endpoint; overrides the public base_url input when nonempty
        required: false

permissions: {}

concurrency:
  group: dryrun-comment-remediation-${{ github.repository_id }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      (github.event_name != 'issue_comment' && inputs.pr_number != '') ||
      (github.event_name == 'issue_comment' &&
       (github.event.action == 'created' || github.event.action == 'edited') &&
       github.event.issue.pull_request &&
       github.event.comment.user.id == 142451713 &&
       github.event.comment.user.login == 'dryrunsecurity[bot]' &&
       github.event.comment.user.type == 'Bot' &&
       github.event.sender.id == 142451713 &&
       github.event.sender.login == 'dryrunsecurity[bot]' &&
       github.event.sender.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: dryrun-comment-propose-${{ github.repository_id }}-${{ github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      source_key: ${{ steps.prepare.outputs.source_key }}
    env:
      REMEDIATION_ROOT: ${{ github.workspace }}/dcode-comment
      IMPLEMENTATION_ROOT: ${{ github.workspace }}/implementation
      SKILLS_ROOT: ${{ github.workspace }}/skills
      INPUTS_JSON: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DryRunSecurity/dr-remediation-action
          ref: 95fc5a9b65e6055714fcf9ee443e5c3af66cffba
          path: implementation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: DryRunSecurity/external-plugin-marketplace
          ref: 918ad791da12f5b7bfa95d3e30a064a18bc9170a
          path: skills
          persist-credentials: false
      - name: Test trusted runner without credentials
        run: python3 -m unittest discover -s "$IMPLEMENTATION_ROOT/.github/dcode-remediation" -p 'test_*.py' -v
      - name: Fetch current DryRun comment and immutable source
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
        run: python3 "$IMPLEMENTATION_ROOT/.github/dcode-remediation/runner.py" prepare-comment --root "$REMEDIATION_ROOT"
      - name: Build isolated pinned dcode runner
        if: steps.prepare.outputs.ready == 'true'
        run: docker build --tag dcode-remediation:0.1.66 "$IMPLEMENTATION_ROOT/.github/dcode-remediation"
      - name: Generate proposed edits without GitHub credentials
        if: steps.prepare.outputs.ready == 'true'
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
        run: python3 "$IMPLEMENTATION_ROOT/.github/dcode-remediation/runner.py" run-agent --root "$REMEDIATION_ROOT"
      - name: Complete npm lockfile without credentials or repository code
        if: steps.prepare.outputs.ready == 'true'
        run: python3 "$IMPLEMENTATION_ROOT/.github/dcode-remediation/runner.py" complete-npm --root "$REMEDIATION_ROOT"
      - name: Validate and package actual edits and explanations
        if: steps.prepare.outputs.ready == 'true'
        run: python3 "$IMPLEMENTATION_ROOT/.github/dcode-remediation/runner.py" bundle --root "$REMEDIATION_ROOT"
      - name: Retain agent diagnostics on failure
        if: failure() && steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dryrun-comment-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REMEDIATION_ROOT }}/agent-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: dryrun-comment-proposal-${{ github.run_id }}
          path: ${{ env.REMEDIATION_ROOT }}/artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: propose
    if: needs.propose.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dryrun-comment-publish-${{ github.repository_id }}-${{ github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      REMEDIATION_ROOT: ${{ github.workspace }}/proposal
      IMPLEMENTATION_ROOT: ${{ github.workspace }}/implementation
      INPUTS_JSON: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DryRunSecurity/dr-remediation-action
          ref: 95fc5a9b65e6055714fcf9ee443e5c3af66cffba
          path: implementation
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dryrun-comment-proposal-${{ github.run_id }}
          path: ${{ env.REMEDIATION_ROOT }}
      - name: Recheck source and publish explanations and suggestions without commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$IMPLEMENTATION_ROOT/.github/dcode-remediation/runner.py" publish-comment --root "$REMEDIATION_ROOT"
